sonar.projectKey=petebytes_lumibot
sonar.projectName=LumiBot

# Source directories
sonar.sources=lumibot

# Exclusions
# - example strategies + bundled resources are illustrative, not library code
# - caches / compiled artifacts carry no signal
sonar.exclusions=**/__pycache__/**,**/*.pyc,lumibot/example_strategies/**,lumibot/resources/**

# Tests live outside sonar.sources (tests/) so they are not analyzed as product code.
# Coverage is not uploaded: the suite needs broker/ThetaData credentials and cannot
# run on CI, so run_tests is disabled in the workflow (static analysis only).

# Python configuration (setup.py: python_requires>=3.10)
sonar.python.version=3.10, 3.11, 3.12
