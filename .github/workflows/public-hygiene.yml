name: Public Leak Check

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - "version/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-hygiene:
    name: Changed-file leak check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Check changed lines for public leaks
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi

          python scripts/check_public_repo_hygiene.py --diff-range "$RANGE"
