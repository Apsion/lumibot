name: SonarQube
on:
  push:
    branches: [dev, "version/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    uses: Apsion/apsion-github-org-workflows/.github/workflows/org-sonarqube.yml@main
    with:
      project_type: python
      # Test suite needs broker/ThetaData credentials -> cannot run on CI.
      # Static analysis only; no coverage upload.
      run_tests: false
    secrets: inherit
